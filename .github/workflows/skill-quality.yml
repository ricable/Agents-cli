name: Skill Quality Gate

on:
  push:
    branches: [main, go]
    paths:
      - 'lib/**'
      - 'examples/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'examples/**'
      - 'tests/**'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit skill quality
        run: npx tsx examples/skill-forge.ts --audit --strict --json > audit-results.json
        continue-on-error: true

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json
