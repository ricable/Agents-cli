name: Deploy SaaS UI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Upload saas-ui as artifact so deploy jobs share the same build
      - uses: actions/upload-artifact@v4
        with:
          name: saas-ui
          path: examples/saas-ui/
          retention-days: 1

  # ── Preview deploy (every push to any branch) ─────────────────────────
  preview:
    name: Vercel Preview
    needs: build
    runs-on: ubuntu-latest
    # Skip on version tags — production job handles those
    if: "!startsWith(github.ref, 'refs/tags/v')"
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saas-ui
          path: saas-ui

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy preview
        id: deploy
        working-directory: saas-ui
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel --token "$VERCEL_TOKEN" --yes 2>&1 | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

  # ── Production deploy (version tags: v1.2.3) ─────────────────────────
  production:
    name: Vercel Production
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://ui.spectredve.com
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: saas-ui
          path: saas-ui

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        working-directory: saas-ui
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --token "$VERCEL_TOKEN" --prod --yes
          echo "Deployed ${{ github.ref_name }} → https://ui.spectredve.com"

      - name: Create GitHub Release summary
        run: |
          echo "## Deployed ${{ github.ref_name }} to production" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** https://ui.spectredve.com" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
